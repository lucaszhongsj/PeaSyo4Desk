appId: com.Geocld.PeaSyo4Desk
productName: PeaSyo4Desk
copyright: Copyright © 2026 Geocld

directories:
  output: dist
  buildResources: resources

files:
  - from: .
    filter:
      - package.json
      - app
      - peasyo-lib
asarUnpack:
  - node_modules/peasyo-sdl-lib/**/*
  - peasyo-lib/**/*.node
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: node_modules/@ffmpeg-installer
    to: ffmpeg-installer
    filter:
      - "*/ffmpeg"
      - "*/ffmpeg.exe"
publish:
- github


# Mac OS configuration
mac:
  category: public.app-category.games
  icon: resources/icon.icns
  mergeASARs: false
  x64ArchFiles: "{Contents/Resources/ffmpeg-installer/**/*,Contents/Resources/app.asar.unpacked/node_modules/peasyo-sdl-lib/**/*}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsLoginHelper: resources/entitlements.mac.plist
  extendInfo:
    NSLocalNetworkUsageDescription: PeaSyo4Desk needs local network access to discover and connect to your PS5 console on the same network.
  # 启用公证:在 CI 中设置 APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、TEAM_ID 后取消下面注释
  # notarize:
  #   teamId: ${TEAM_ID}
  target:
  - target: dmg
    arch:
    - universal

# Config for OSX dmg
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: "link"
      path: "/Applications"

# Windows configuration
win:
  icon: resources/icon.ico
  signAndEditExecutable: true
  target:
    - "zip"
    - "nsis"

# Config for the windows installer
nsis:
  oneClick: true
  perMachine: true

# Linux configuration
linux:
  category: Game
  icon: resources/PeaSyo.png
  target:
    - "AppImage"
    - "deb"
